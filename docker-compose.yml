services:
  # The Scraping App
  hiresight-app:
    build: .
    env_file: .env
    depends_on:
      postgres-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  # PostgreSQL for Raw Listings
  postgres-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: hiresight
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hiresight"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MongoDB for Enriched Data
  mongo-db:
    image: mongo:latest
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5
